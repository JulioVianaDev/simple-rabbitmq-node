services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672" # AMQP port
      - "15672:15672" # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - rabbitmq_network

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: webhook_messages
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./multiple-cores-with-queues/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql
      - ./webhook-hierarchy/init-db.sql:/docker-entrypoint-initdb.d/02-webhook-hierarchy.sql
    networks:
      - rabbitmq_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  rabbitmq_data:
  postgres_data:

networks:
  rabbitmq_network:
    driver: bridge
